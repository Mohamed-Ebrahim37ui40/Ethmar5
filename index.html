mpty\">لا توجد عربيات بعد.<\/div>\n<\/div>\n\n<div class=\"card\">\n  <h2>التقرير<\/h2>\n  <textarea id=\"rep\" readonly><\/textarea>\n  <div class=\"row\">\n    <button id=\"wa\">إرسال واتساب<\/button>\n    <button class=\"sec\" id=\"copy\">نسخ النص<\/button>\n    <button class=\"sec\" id=\"xls\">تحميل Excel<\/button>\n    <button class=\"sec\" id=\"csv\">تحميل CSV<\/button>\n    <button class=\"del\" id=\"reset\">حذف كل البيانات<\/button>\n  <\/div>\n<\/div>\n\n<script>\nconst DIS=[\"اضرار\",\"عفن جاف\",\"ريزو\",\"جرب\",\"زوتنه\",\"شروخ\",\"بلاك\",\"فيرس\",\"فقد حيوية\",\"سوسه\",\"عفن طري\"];\nconst ORD=[\"الأولي\",\"الثانية\",\"الثالثة\",\"الرابعة\",\"الخامسة\",\"السادسة\",\"السابعة\",\"الثامنة\",\"التاسعة\",\"العاشرة\"];\nconst $=id=>document.getElementById(id);\nlet S={farm:\"\",field:\"\",variety:\"\",trucks:[]},editing=-1;\ntry{const x=localStorage.getItem(\"pi\");if(x)S=JSON.parse(x)}catch(e){}\nfunction persist(){S.farm=$(\"farm\").value;S.field=$(\"field\").value;S.variety=$(\"variety\").value;try{localStorage.setItem(\"pi\",JSON.stringify(S))}catch(e){}}\nconst n=v=>parseFloat(v)||0;\nconst fmt=v=>String(+v.toFixed(1));\nfunction calc(t){\n  const w=n(t.w),c25=w?Math.round(n(t.c)/w*25):0;\n  const p=DIS.map((d,i)=>w&&n(t.d[i])?[d,n(t.d[i])/w*100]:null).filter(Boolean);\n  return{c25,p};\n}\nfunction tname(i){return \"العربية \"+(ORD[i]||(\"رقم \"+(i+1)))}\n// build disease inputs\n$(\"dgrid\").innerHTML=DIS.map((d,i)=>`<div><label>${d}<\/label><input class=\"di\" data-i=\"${i}\" type=\"number\" step=\"any\" inputmode=\"decimal\"><div class=\"pct\" id=\"p${i}\"><\/div><\/div>`).join(\"\");\nfunction live(){\n  const w=n($(\"tw\").value);\n  $(\"c25\").textContent=w&&n($(\"tc\").value)?\"العدد في 25 كجم: \"+Math.round(n($(\"tc\").value)/w*25)+\" درنة\":\"\";\n  document.querySelectorAll(\".di\").forEach(e=>{const v=n(e.value);$(\"p\"+e.dataset.i).textContent=w&&v?fmt(v/w*100)+\"%\":\"\"});\n}\ndocument.querySelectorAll(\"#tw,#tc,.di\").forEach(e=>e.addEventListener(\"input\",live));\n[\"farm\",\"field\",\"variety\"].forEach(id=>{$(id).value=S[id]||\"\";$(id).addEventListener(\"input\",()=>{persist();render()})});\nfunction clearForm(){editing=-1;$(\"formTitle\").textContent=\"إضافة عربية\";$(\"tname\").value=tname(S.trucks.length);$(\"tw\").value=\"\";$(\"tc\").value=\"\";document.querySelectorAll(\".di\").forEach(e=>e.value=\"\");live()}\n$(\"clear\").onclick=clearForm;\n$(\"save\").onclick=()=>{\n  if(!n($(\"tw\").value)){alert(\"أدخل الوزن الإجمالي\");return}\n  const t={name:$(\"tname\").value||tname(S.trucks.length),w:$(\"tw\").value,c:$(\"tc\").value,d:DIS.map((_,i)=>document.querySelector(`.di[data-i=\"${i}\"]`).value)};\n  if(editing>=0)S.trucks[editing]=t;else S.trucks.push(t);\n  persist();clearForm();render();\n};\nfunction edit(i){const t=S.trucks[i];editing=i;$(\"formTitle\").textContent=\"تعديل: \"+t.name;$(\"tname\").value=t.name;$(\"tw\").value=t.w;$(\"tc\").value=t.c;\n  document.querySelectorAll(\".di\").forEach(e=>e.value=t.d[e.dataset.i]||\"\");live();scrollTo({top:0,behavior:\"smooth\"})}\nfunction del(i){if(confirm(\"حذف \"+S.trucks[i].name+\"؟\")){S.trucks.splice(i,1);persist();render()}}\nfunction report(){\n  let h=[];\n  if(S.farm)h.push(S.farm);if(S.field)h.push(S.field);if(S.variety)h.push(\"الصنف :   \"+S.variety);\n  let out=h.join(\"\\n\");\n  S.trucks.forEach((t,i)=>{\n    const r=calc(t);\n    out+=(out?\"\\n\":\"\")+\"---------------------------------\\n\"+t.name+\"\\nـ العدد في ال25ك : \"+r.c25+\" درنه\\n\"+r.p.map(([d,v])=>\"- \"+d+\" : \"+fmt(v)+\"%\").join(\"\\n\");\n    out+=\"\\n\";\n  });\n  return out.trim();\n}\nfunction render(){\n  $(\"cnt\").textContent=S.trucks.length;\n  $(\"empty\").style.display=S.trucks.length?\"none\":\"block\";\n  $(\"list\").innerHTML=S.trucks.map((t,i)=>{const r=calc(t);return `<div class=\"item\"><span><b>${t.name}<\/b> — ${t.w} | ${r.c25} درنة/25ك<\/span><span><button class=\"sec\" onclick=\"edit(${i})\">تعديل<\/button> <button class=\"del\" onclick=\"del(${i})\">حذف<\/button><\/span><\/div>`}).join(\"\");\n  $(\"rep\").value=report();\n}\n$(\"copy\").onclick=async()=>{try{await navigator.clipboard.writeText($(\"rep\").value)}catch(e){$(\"rep\").select();document.execCommand(\"copy\")}alert(\"تم النسخ\")};\n$(\"wa\").onclick=()=>window.open(\"https://wa.me/?text=\"+encodeURIComponent($(\"rep\").value),\"_blank\");\nfunction table(){\n  const used=DIS.map((d,i)=>S.trucks.some(t=>n(t.d[i])>0));\n  const head=[\"العربية\",\"الوزن الإجمالي\",\"العدد في العينة\",\"العدد في 25ك\",...DIS.filter((_,i)=>used[i]).map(d=>d+\" %\")];\n  const rows=S.trucks.map(t=>{const r=calc(t),m=Object.fromEntries(r.p);\n    return[t.name,n(t.w),n(t.c),r.c25,...DIS.filter((_,i)=>used[i]).map(d=>m[d]!==undefined?+m[d].toFixed(1):0)]});\n  return[head,...rows];\n}\nfunction dl(name,mime,txt){const a=document.createElement(\"a\");a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove()}\nconst fname=()=>\"فحص_\"+(S.field||\"تقاوي\").replace(/\\s+/g,\"_\");\n$(\"csv\").onclick=()=>dl(fname()+\".csv\",\"text/csv;charset=utf-8\",\"\\uFEFF\"+table().map(r=>r.map(c=>`\"${c}\"`).join(\",\")).join(\"\\r\\n\"));\n$(\"xls\").onclick=()=>{\n  const t=table();\n  const title=[S.farm,S.field,S.variety].filter(Boolean).join(\" - \");\n  const html=`<html dir=\"rtl\"><head><meta charset=\"utf-8\"><\/head><body><table border=\"1\">${title?`<tr><th colspan=\"${t[0].length}\">${title}<\/th><\/tr>`:\"\"}${t.map((r,i)=>\"<tr>\"+r.map(c=>i?`<td>${c}<\/td>`:`<th>${c}<\/th>`).join(\"\")+\"<\/tr>\").join(\"\")}<\/table><\/body><\/html>`;\n  dl(fname()+\".xls\",\"application/vnd.ms-excel\",html);\n};\n$(\"reset\").onclick=()=>{if(confirm(\"حذف كل العربيات؟\")){S.trucks=[];persist();clearForm();render()}};\nclearForm();render();\n<\/script>\n<\/body>\n<\/html>\n", "sprout": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>متابعة الإنبات – مزرعة اثمار<\/title>\n<style>\n:root{--bg:#f3f5ee;--card:#fff;--ink:#1d2a1a;--mut:#667262;--line:#d9dfd0;--g:#2f6b2f;--g2:#e4efd9;--warn:#b3402a}\n@media (prefers-color-scheme:dark){:root{--bg:#161b14;--card:#202719;--ink:#eef2e8;--mut:#9aa693;--line:#35402e;--g:#8cc46a;--g2:#2a3622;--warn:#ff9a82}}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Tahoma,\"Segoe UI\",Arial,sans-serif;background:var(--bg);color:var(--ink);padding:12px;max-width:900px;margin-inline:auto;line-height:1.5}\nh1{font-size:20px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 8px}\n.sub{color:var(--mut);font-size:13px;margin-bottom:10px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}\n.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}\n@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}\nlabel{font-size:12px;color:var(--mut);display:block}\ninput,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}\ninput:focus,select:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}\n.tw{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:14px}\nth,td{padding:4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}\nth{font-size:12px;color:var(--mut);font-weight:600}\ntd input{min-width:62px;text-align:center;padding:6px}\ntd.calc{color:var(--mut);font-size:12px;min-width:150px}\n.qh td{background:var(--g2);font-weight:700;text-align:right;padding:8px}\nbutton{font:inherit;cursor:pointer;border:1px solid var(--g);background:var(--g);color:#fff;border-radius:8px;padding:9px 14px}\nbutton.o{background:transparent;color:var(--g)}\nbutton.x{background:transparent;border:none;color:var(--warn);padding:4px 8px;font-size:18px}\n.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}\n.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}\n@media(min-width:600px){.big{grid-template-columns:repeat(3,1fr)}}\n.k{background:var(--g2);border-radius:8px;padding:10px}\n.k b{display:block;font-size:22px;color:var(--g)}\n.k span{font-size:12px;color:var(--mut)}\npre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:14px;margin:0}\n.msg{font-size:13px;color:var(--g);min-height:18px}\n@media print{.noprint{display:none}body{background:#fff;color:#000}}\n<\/style>\n<\/head>\n<body>\n<h1>متابعة الإنبات<\/h1>\n<div class=\"sub\">أدخل قراءات كل عينة (5 متر) وسيحسب التقرير تلقائياً<\/div>\n\n<div class=\"card noprint\">\n<div class=\"grid\">\n<div><label>المزرعة<\/label><input id=\"farm\" value=\"مزرعة اثمار\"><\/div>\n<div><label>البيفوت<\/label><input id=\"pivot\" value=\"15\"><\/div>\n<div><label>الصنف<\/label><input id=\"variety\" value=\"Brooke G3\"><\/div>\n<div><label>المتابعة<\/label><input id=\"week\" value=\"متابعة إنبات الأسبوع الأول\"><\/div>\n<div><label>التاريخ<\/label><input id=\"date\" type=\"date\"><\/div>\n<div><label>طول العينة (متر)<\/label><input id=\"len\" type=\"number\" value=\"5\" min=\"1\" step=\"0.5\"><\/div>\n<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>إدخال العينات<\/h2>\n<div class=\"tw\"><table>\n<thead><tr><th><\/th><th>عدد الدرنات<\/th><th>عدد السيقان<\/th><th>سيقان بها ريزوكتونيا<\/th><th>درنات متعفنة<\/th><th>طول الساق (سم)<\/th><th>النتائج<\/th><th><\/th><\/tr><\/thead>\n<tbody id=\"rows\"><\/tbody>\n<\/table><\/div>\n<div class=\"bar noprint\">\n<button class=\"o\" id=\"clr\">مسح كل البيانات<\/button>\n<\/div>\n<\/div>\n\n<div class=\"card\" id=\"rep\">\n<h2>التقرير<\/h2>\n<div class=\"big\" id=\"big\"><\/div>\n<div class=\"tw\"><table id=\"qt\"><\/table><\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>نص التقرير<\/h2>\n<pre id=\"txt\"><\/pre>\n<div class=\"bar noprint\">\n<button id=\"wa\">إرسال واتساب<\/button>\n<button class=\"o\" id=\"cp\">نسخ النص<\/button>\n<button class=\"o\" id=\"csv\">تنزيل Excel (CSV)<\/button>\n<button class=\"o\" id=\"pr\">طباعة / PDF<\/button>\n<\/div>\n<div class=\"msg\" id=\"msg\"><\/div>\n<\/div>\n\n<script>\nconst Q=['A','B','C','D'];\nconst F=['tub','stm','rhz','rot','len'];\nlet data=[]; // {q, tub, stm, rhz, rot, len}\nconst KEY='athmar_sprout_v1';\nconst $=id=>document.getElementById(id);\nconst nz=v=>v===''||v===null||isNaN(+v)?null:+v;\nconst f1=(x,d=1)=>x==null||!isFinite(x)?'–':(+x).toFixed(d).replace(/\\.0+$/,'');\n\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify({data,h:['farm','pivot','variety','week','date','len'].map(i=>$(i).value)}))}catch(e){}}\nfunction load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){data=s.data;['farm','pivot','variety','week','date','len'].forEach((i,k)=>$(i).value=s.h[k])}}catch(e){}\n if(!data.length){Q.forEach(q=>{data.push(blank(q));data.push(blank(q))})}}\nfunction blank(q){return{q,tub:'',stm:'',rhz:'',rot:'',len:''}}\n\nfunction agg(list){\n const L=nz($('len').value)||5;\n const ok=list.filter(r=>nz(r.tub)!==null&&nz(r.stm)!==null);\n if(!ok.length)return null;\n const sum=k=>ok.reduce((a,r)=>a+(nz(r[k])||0),0);\n const T=sum('tub'),S=sum('stm'),R=sum('rhz'),O=sum('rot');\n const lens=ok.filter(r=>nz(r.len)!==null);\n return{n:ok.length,tm:T/ok.length/L,sm:S/ok.length/L,spt:T?S/T:null,rh:S?R/S*100:null,rot:T?O/T*100:null,len:lens.length?lens.reduce((a,r)=>a+ +r.len,0)/lens.length:null}\n}\n\nfunction renderRows(){\n const tb=$('rows');tb.innerHTML='';\n Q.forEach(q=>{\n  const h=document.createElement('tr');h.className='qh';\n  h.innerHTML=`<td colspan=\"8\">الربع ${q} <button class=\"o noprint\" style=\"padding:3px 10px;margin-inline-start:8px\" data-add=\"${q}\">+ عينة<\/button><\/td>`;\n  tb.appendChild(h);\n  let c=0;\n  data.forEach((r,i)=>{ if(r.q!==q)return; c++;\n   const tr=document.createElement('tr');\n   tr.innerHTML=`<td>${q}${c}<\/td>`+F.map(k=>`<td><input type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"any\" data-i=\"${i}\" data-k=\"${k}\" value=\"${r[k]}\"><\/td>`).join('')+`<td class=\"calc\" id=\"c${i}\"><\/td><td><button class=\"x noprint\" data-del=\"${i}\" title=\"حذف\">×<\/button><\/td>`;\n   tb.appendChild(tr);\n  });\n });\n data.forEach((_,i)=>calcRow(i));\n}\nfunction calcRow(i){\n const r=data[i],L=nz($('len').value)||5,t=nz(r.tub),s=nz(r.stm),e=$('c'+i);\n if(!e)return;\n if(t===null||s===null){e.textContent='';return}\n e.textContent=`درنة/م ${f1(t/L)} | ساق/م ${f1(s/L)} | ساق/درنة ${f1(t?s/t:null)}`;\n}\n\nfunction report(){\n const all=agg(data),meta={farm:$('farm').value,pivot:$('pivot').value,variety:$('variety').value,week:$('week').value,date:$('date').value};\n const kp=[['الدرنات/م',all&&f1(all.tm)],['السيقان/م',all&&f1(all.sm)],['السيقان/درنة',all&&f1(all.spt)],['الريزوكتونيا/الساق',all&&f1(all.rh)+'%'],['العفن',all&&f1(all.rot)+'%'],['طول الساق (سم)',all&&f1(all.len)]];\n $('big').innerHTML=kp.map(([a,b])=>`<div class=\"k\"><b>${all?b:'–'}<\/b><span>${a}<\/span><\/div>`).join('');\n let h='<thead><tr><th>الربع<\/th><th>عينات<\/th><th>درنة/م<\/th><th>ساق/م<\/th><th>ساق/درنة<\/th><th>ريزوك %<\/th><th>عفن %<\/th><th>الطول<\/th><\/tr><\/thead><tbody>';\n const row=(n,a)=>a?`<tr><td>${n}<\/td><td>${a.n}<\/td><td>${f1(a.tm)}<\/td><td>${f1(a.sm)}<\/td><td>${f1(a.spt)}<\/td><td>${f1(a.rh)}<\/td><td>${f1(a.rot)}<\/td><td>${f1(a.len)}<\/td><\/tr>`:`<tr><td>${n}<\/td><td colspan=\"7\">–<\/td><\/tr>`;\n Q.forEach(q=>h+=row(q,agg(data.filter(r=>r.q===q))));\n h+='<tr style=\"font-weight:700\">'+row('المتوسط',all).slice(4);\n $('qt').innerHTML=h+'<\/tbody>';\n let t=`*${meta.farm}*\\nبيفوت ${meta.pivot}\\nالصنف (${meta.variety})\\n${meta.week}${meta.date?'\\nالتاريخ: '+meta.date:''}\\n*المتوسط*\\n`;\n if(all){\n  t+=`الدرنات/م ${f1(all.tm)} درنة\\nالسيقان/م ${f1(all.sm)} ساق\\nالسيقان/درنة ${f1(all.spt)} ساق\\nالريزوكتونيا/الساق ${f1(all.rh)}%\\nالعفن ${f1(all.rot)}٪\\nطول الساق ${f1(all.len)}سم\\nعدد العينات: ${all.n}`;\n } else t+='(أدخل البيانات)';\n $('txt').textContent=t;\n save();\n}\n\nfunction msg(m){$('msg').textContent=m;setTimeout(()=>$('msg').textContent='',2500)}\n\ndocument.addEventListener('input',e=>{\n const t=e.target;\n if(t.dataset.i!==undefined){data[t.dataset.i][t.dataset.k]=t.value;calcRow(+t.dataset.i)}\n report();\n});\ndocument.addEventListener('click',e=>{\n const t=e.target;\n if(t.dataset.add){data.push(blank(t.dataset.add));renderRows();report()}\n if(t.dataset.del!==undefined){data.splice(+t.dataset.del,1);renderRows();report()}\n});\n$('clr').onclick=()=>{if(confirm('مسح كل العينات؟')){data=[];Q.forEach(q=>{data.push(blank(q));data.push(blank(q))});renderRows();report()}};\n$('wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent($('txt').textContent),'_blank');\n$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('txt').textContent);msg('تم النسخ')}catch(e){msg('تعذر النسخ')}};\n$('pr').onclick=()=>window.print();\n$('csv').onclick=()=>{\n const L=nz($('len').value)||5;\n let c='الربع,العينة,الدرنات,السيقان,سيقان ريزوكتونيا,درنات متعفنة,طول الساق,درنة/م,ساق/م,ساق/درنة,ريزوك %,عفن %\\n';\n const cnt={};\n data.forEach(r=>{cnt[r.q]=(cnt[r.q]||0)+1;const t=nz(r.tub),s=nz(r.stm);if(t===null||s===null)return;\n  c+=[r.q,cnt[r.q],t,s,r.rhz,r.rot,r.len,f1(t/L,2),f1(s/L,2),t?f1(s/t,2):'',s&&nz(r.rhz)!==null?f1(r.rhz/s*100,2):'',t&&nz(r.rot)!==null?f1(r.rot/t*100,2):''].join(',')+'\\n'});\n const row=(n,a)=>a?[n,a.n,'','','','',f1(a.len,2),f1(a.tm,2),f1(a.sm,2),f1(a.spt,2),f1(a.rh,2),f1(a.rot,2)].join(',')+'\\n':'';\n c+='\\n';Q.forEach(q=>c+=row('متوسط '+q,agg(data.filter(r=>r.q===q))));c+=row('المتوسط العام',agg(data));\n const a=document.createElement('a');\n a.href=URL.createObjectURL(new Blob(['\\ufeff'+c],{type:'text/csv;charset=utf-8'}));\n a.download='sprouting_pivot'+$('pivot').value+'.csv';a.click();msg('تم التنزيل – افتحه بالإكسل');\n};\n\nif(!$('date').value)$('date').valueAsDate=new Date();\nload();renderRows();report();\n<\/script>\n<\/body>\n<\/html>\n", "harvest": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<title>تقرير تجربة الحصاد<\/title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<style>\n:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a1f;--mut:#6b7a6d;--ac:#2f7d3a;--bd:#d9dfd5;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#141a15;--card:#1d261f;--tx:#e8efe8;--mut:#9aa89c;--ac:#5fb36b;--bd:#2f3d32;--in:#141a15}}\n:root[data-theme=\"dark\"]{--bg:#141a15;--card:#1d261f;--tx:#e8efe8;--mut:#9aa89c;--ac:#5fb36b;--bd:#2f3d32;--in:#141a15}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,\"Segoe UI\",Arial,sans-serif;font-size:15px;max-width:720px;margin-inline:auto;padding:12px}\nh2{font-size:17px;margin:0 0 8px;color:var(--ac)}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}\n.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}\nlabel{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}\ninput,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}\nbutton{padding:9px 12px;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;font:inherit;cursor:pointer}\nbutton.s{background:transparent;color:var(--ac)}button.d{background:transparent;color:#c0392b;border-color:#c0392b}\n.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}\n.tab.on{background:var(--ac);color:#fff}.tab{background:transparent;color:var(--ac)}\n.sm{border-top:1px dashed var(--bd);padding-top:10px;margin-top:10px}\n.res{font-size:12px;color:var(--mut);margin-top:6px}\ntextarea#rep{height:380px;line-height:1.7;direction:rtl}\n.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}\n#msg{font-size:12px;color:var(--ac);min-height:16px}\n<\/style>\n<\/head>\n<body>\n<div class=\"card\"><h2>بيانات التجربة<\/h2><div class=\"g\" id=\"meta\"><\/div><\/div>\n<div class=\"card\"><h2>الأعمار<\/h2><div class=\"row\" id=\"tabs\"><\/div><div id=\"ageBox\"><\/div><\/div>\n<div class=\"card\" id=\"cfgBox\"><\/div>\n<div class=\"card\"><h2>التقرير<\/h2>\n<textarea id=\"rep\" readonly><\/textarea>\n<div class=\"row\" style=\"margin-top:8px\">\n<button id=\"bCopy\">نسخ<\/button>\n<a id=\"bWa\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none\"><button class=\"s\" type=\"button\">واتساب<\/button><\/a>\n<button class=\"s\" id=\"bAll\">نسخ كل الأعمار<\/button>\n<\/div>\n<div class=\"row\">\n<button class=\"s\" id=\"bX\">تصدير Excel<\/button>\n<button class=\"s\" id=\"bI\">استيراد Excel<\/button>\n<input type=\"file\" id=\"fi\" accept=\".xlsx,.xls,.csv\" hidden>\n<\/div><div id=\"msg\"><\/div><\/div>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script>\nconst MF=[['farm','المزرعة'],['trial','اسم التجربة'],['pivot','البيفوت'],['area','المساحة (فدان)'],['variety','الصنف'],['canopy','كفاءة العرش %'],['deduct','نسبة الخصم %']];\nconst SF=[['plants','عدد النباتات'],['stems','عدد السيقان'],['area','مساحة العينة م²'],['w40','وزن 40D كجم'],['c40','عدد 40D'],['w4055','وزن 40-55 كجم'],['c4055','عدد 40-55'],['w55','وزن 55UP كجم'],['c55','عدد 55UP'],['green','وزن اخضرار كجم'],['rhizo','وزن ريزوكتونيا كجم'],['scab','وزن جرب عادي كجم'],['crack','وزن تشققات كجم'],['black','وزن بلاك ليج كجم'],['fry','عيوب الفراير %']];\nconst GEN=['plants','stems','area','fry'];\nconst DEF={sizes:[{k:'40',n:'40D'},{k:'4055',n:'40-55'},{k:'55',n:'55UP'}],dis:[{k:'green',n:'الاخضرار'},{k:'rhizo',n:'ريزوكتونيا'},{k:'scab',n:'جرب عادي'},{k:'crack',n:'تشققات'},{k:'black',n:'بلاك ليج'}]};\nconst szK=()=>S.cfg.sizes.flatMap(z=>['w'+z.k,'c'+z.k]);\nconst dsK=()=>S.cfg.dis.map(d=>d.k);\nconst AK=()=>GEN.concat(szK(),dsK());\nfunction lab(k){for(const z of S.cfg.sizes){if(k==='w'+z.k)return 'وزن '+z.n+' (كجم)';if(k==='c'+z.k)return 'عدد '+z.n}\n for(const d of S.cfg.dis)if(k===d.k)return 'وزن '+d.n+' (كجم)';return SF.find(x=>x[0]===k)[1]}\nlet SUB='sz';\nconst LB={w40:'وزن 40D (كجم)',c40:'عدد 40D',w4055:'وزن 40-55 (كجم)',c4055:'عدد 40-55',w55:'وزن 55UP (كجم)',c55:'عدد 55UP'};\nfunction fh(i,s,ks){return ks.map(k=>{const l=lab(k);return '<div><label>'+l+'<\/label><input type=\"number\" inputmode=\"decimal\" step=\"any\" data-s=\"'+i+'\" data-k=\"'+k+'\" value=\"'+(s[k]??'')+'\"><\/div>'}).join('')}\nconst KEY='harvest_v1';\nlet S={meta:{farm:'اثمار',trial:'تجربة حصاد',pivot:'',area:'',variety:'',canopy:'',deduct:20},ages:[{age:100,samples:[{area:5}]}],sel:0};\ntry{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}\nif(!S.cfg)S.cfg=JSON.parse(JSON.stringify(DEF));\nconst $=id=>document.getElementById(id);\nconst n=v=>{const x=parseFloat(v);return isNaN(x)?0:x};\nconst f=(x,d)=>(+x.toFixed(d)).toString();\nconst mean=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:0;\nfunction calc(s){\n const Z=S.cfg.sizes;let t=0,c=0;Z.forEach(z=>{t+=n(s['w'+z.k]);c+=n(s['c'+z.k])});\n const a=n(s.area)||5,p=v=>t?n(v)/t*100:0,o={t,c,y:t/a*4200/1000,aw:c?t/c*1000:0,per10:t?c/t*10:0,fry:n(s.fry),pl:n(s.plants),st:n(s.stems)};\n Z.forEach(z=>o['p'+z.k]=p(s['w'+z.k]));S.cfg.dis.forEach(d=>o['d'+d.k]=p(s[d.k]));return o}\nfunction avg(age){\n const rs=age.samples.map(calc).filter(r=>r.t>0);\n const o={cnt:rs.length};\n ['y','aw','per10','pl','st','fry'].concat(S.cfg.sizes.map(z=>'p'+z.k),S.cfg.dis.map(d=>'d'+d.k)).forEach(k=>o[k]=mean(rs.map(r=>r[k])));\n return o;\n}\nfunction report(age){\n const m=S.meta,a=avg(age),d=n(m.deduct);\n if(!a.cnt)return 'أدخل بيانات العينات لعرض التقرير';\n const L=[];\n L.push('مزرعة '+(m.farm||''),'*'+(m.trial||'تجربة حصاد')+'*');\n if(m.pivot)L.push('بيفوت '+m.pivot);\n if(m.area)L.push('المساحة '+m.area+' فدان');\n if(m.variety)L.push('الصنف '+m.variety);\n L.push('العمر '+age.age);\n if(m.canopy)L.push('كفاءة العرش '+m.canopy+'%');\n L.push('_________________','متوسط عيوب الفراير','%'+f(a.fry,1),'_______________','');\n L.push('* متوسط الإنتاجية قبل خصم '+d+'%← '+f(a.y,3)+' طن');\n L.push('* متوسط الإنتاجية بعد خصم '+d+'%← '+f(a.y*(1-d/100),3)+' طن');\n S.cfg.sizes.forEach(z=>L.push('* متوسط نسبة الحجم('+z.n+')← '+f(a['p'+z.k],2)+'%'));\n L.push('* متوسط وزن الدرنة '+Math.round(a.aw)+' جرام');\n L.push('* متوسط عدد الدرنات في 10ك '+Math.round(a.per10)+' درنة');\n if(a.pl)L.push('* متوسط عدد النباتات '+f(a.pl,1));\n if(a.st)L.push('* متوسط عدد السيقان '+f(a.st,1)+(a.pl?' ('+f(a.st/a.pl,1)+' ساق/نبات)':''));\n L.push('','*نسب أمراض الدرنات*');\n S.cfg.dis.forEach(d=>L.push('* متوسط نسبة '+d.n+' '+f(a['d'+d.k],1)+'%'));\n return L.join('\\n');\n}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}\nfunction msg(t){$('msg').textContent=t;setTimeout(()=>{if($('msg').textContent===t)$('msg').textContent=''},4000)}\nfunction upd(){\n const age=S.ages[S.sel];\n const r=report(age);$('rep').value=r;\n $('bWa').href='https://wa.me/?text='+encodeURIComponent(r);\n document.querySelectorAll('[data-res]').forEach(el=>{\n  const c=calc(age.samples[+el.dataset.res]);\n  el.textContent=c.t?'الإجمالي '+f(c.t,2)+' كجم | إنتاجية '+f(c.y,3)+' طن/فدان | وزن الدرنة '+Math.round(c.aw)+' جم':'';\n });\n save();\n}\nfunction drawMeta(){\n $('meta').innerHTML=MF.map(([k,l])=>'<div><label>'+l+'<\/label><input data-m=\"'+k+'\" value=\"'+(S.meta[k]??'')+'\"><\/div>').join('');\n $('meta').oninput=e=>{const k=e.target.dataset.m;if(k){S.meta[k]=e.target.value;upd()}};\n}\nfunction drawAges(){\n $('tabs').innerHTML=S.ages.map((a,i)=>'<button class=\"tab '+(i===S.sel?'on':'')+'\" data-t=\"'+i+'\">عمر '+a.age+'<\/button>').join('')+'<button class=\"s\" id=\"addAge\">+ عمر<\/button>';\n $('tabs').onclick=e=>{\n  const b=e.target.closest('button');if(!b)return;\n  if(b.id==='addAge'){S.ages.push({age:0,samples:[{area:5}]});S.sel=S.ages.length-1}\n  else if(b.dataset.t!==undefined)S.sel=+b.dataset.t;\n  drawAges();\n };\n const age=S.ages[S.sel];\n let h='<div class=\"g\"><div><label>العمر (يوم)<\/label><input id=\"ageIn\" type=\"number\" value=\"'+age.age+'\"><\/div><div style=\"align-self:end\"><button class=\"d\" id=\"delAge\">حذف هذا العمر<\/button><\/div><\/div>';\n age.samples.forEach((s,i)=>{\n  h+='<div class=\"sm\"><div class=\"hd\"><b>عينة '+(i+1)+'<\/b><button class=\"d\" data-del=\"'+i+'\">حذف<\/button><\/div>'+\n  '<div class=\"g\">'+fh(i,s,GEN)+'<\/div>'+\n  '<div class=\"row\" style=\"margin-top:10px\"><button class=\"tab s'+(SUB==='sz'?' on':'')+'\" data-sub=\"sz\">الأحجام<\/button><button class=\"tab s'+(SUB==='ds'?' on':'')+'\" data-sub=\"ds\">الأمراض<\/button><\/div>'+\n  '<div class=\"g\">'+fh(i,s,SUB==='sz'?szK():dsK())+'<\/div><div class=\"res\" data-res=\"'+i+'\"><\/div><\/div>';\n });\n h+='<div class=\"row\" style=\"margin-top:10px\"><button id=\"addS\">+ عينة<\/button><\/div>';\n $('ageBox').innerHTML=h;\n $('ageIn').oninput=e=>{age.age=n(e.target.value);const t=$('tabs').children[S.sel];if(t)t.textContent='عمر '+age.age;upd()};\n $('delAge').onclick=()=>{if(S.ages.length<2){msg('لا يمكن حذف العمر الوحيد');return}S.ages.splice(S.sel,1);S.sel=0;drawAges()};\n $('addS').onclick=()=>{age.samples.push({area:5});drawAges()};\n $('ageBox').oninput=e=>{const t=e.target;if(t.dataset.k){age.samples[+t.dataset.s][t.dataset.k]=t.value;upd()}};\n $('ageBox').onclick=e=>{const sb=e.target.closest('[data-sub]');if(sb){SUB=sb.dataset.sub;drawAges();return}const b=e.target.closest('[data-del]');if(b){age.samples.splice(+b.dataset.del,1);if(!age.samples.length)age.samples.push({area:5});drawAges()}};\n upd();\n}\nfunction drawCfg(){\n const row=(g,x)=>'<div class=\"row\"><input data-cn=\"'+g+'\" data-id=\"'+x.k+'\" value=\"'+x.n+'\" style=\"flex:1\"><button class=\"d\" data-cd=\"'+g+'\" data-id=\"'+x.k+'\">×<\/button><\/div>';\n $('cfgBox').innerHTML='<h2>الأحجام والأمراض<\/h2><label>الأحجام<\/label>'+S.cfg.sizes.map(z=>row('sizes',z)).join('')+'<button class=\"s\" data-ca=\"sizes\">+ حجم جديد<\/button><label style=\"margin-top:10px\">الأمراض<\/label>'+S.cfg.dis.map(d=>row('dis',d)).join('')+'<button class=\"s\" data-ca=\"dis\">+ مرض جديد<\/button>';\n}\n$('cfgBox').oninput=e=>{const g=e.target.dataset.cn;if(g){const x=S.cfg[g].find(o=>o.k===e.target.dataset.id);if(x){x.n=e.target.value;upd()}}};\n$('cfgBox').onchange=e=>{if(e.target.dataset.cn)drawAges()};\n$('cfgBox').onclick=e=>{const b=e.target.closest('button');if(!b)return;\n if(b.dataset.ca){S.cfg[b.dataset.ca].push({k:'n'+Date.now(),n:'جديد'})}\n else if(b.dataset.cd){const g=b.dataset.cd;if(g==='sizes'&&S.cfg.sizes.length<2){msg('لازم يفضل حجم واحد على الأقل');return}S.cfg[g]=S.cfg[g].filter(o=>o.k!==b.dataset.id)}\n else return;drawCfg();drawAges()};\nfunction copy(t){\n const done=()=>msg('تم النسخ');\n if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done);\n}\nfunction fb(t,done){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(e){msg('انسخ النص يدويا من المربع')}x.remove()}\n$('bCopy').onclick=()=>copy($('rep').value);\n$('bAll').onclick=()=>copy(S.ages.map(report).join('\\n\\n=====\\n\\n'));\n$('bX').onclick=async()=>{\n if(typeof XLSX==='undefined'){msg('مكتبة Excel لم تحمل');return}\n const wb=XLSX.utils.book_new();\n XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['key','value']].concat(MF.map(([k])=>[k,S.meta[k]??'']))),'meta');\n const hdr=['age','sample'].concat(AK()),rows=[hdr];\n S.ages.forEach(a=>a.samples.forEach((s,i)=>rows.push([a.age,i+1].concat(AK().map(k=>s[k]===undefined||s[k]===''?'':n(s[k]))))));\n XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'samples');\n XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['type','key','name']  el=$('t'+s+r);if(el)el.placeholder=t.value!==''?Math.round(tot(s,S[s].rows[r])):''}}save()});\n\nfunction addS(s){S[s].rows.push(blank());save();renderData()}\nfunction delS(s,i){S[s].rows.splice(i,1);if(!S[s].rows.length)S[s].rows.push(blank());save();renderData()}\nfunction addC(s){const n=prompt('اسم المرض/الآفة:');if(n){S[s].cols.push(n);save();renderData()}}\nfunction delC(s,j){if(confirm('حذف العمود؟')){S[s].cols.splice(j,1);S[s].rows.forEach(r=>r.vals.splice(j,1));save();renderData()}}\n\nfunction tot(sec,r){if(r.total!==''&&r.total!=null&&!isNaN(r.total))return+r.total;\nif(sec=='veg'&&r.dist!==''&&!isNaN(r.dist))return r.dist/(+S.info.rowW||1.1)*(+S.info.ppm||1);return 0}\nfunction calc(sec){const d=S[sec];let n=0,T=0;\nconst valid=d.rows.filter(r=>tot(sec,r)>0&&r.vals.some(x=>x!==''&&x!=null&&!isNaN(x)));\nvalid.forEach(r=>T+=tot(sec,r));\nconst res=d.cols.map((name,j)=>{let ps=[],si=0,st=0;\nvalid.forEach(r=>{const t=tot(sec,r),x=+(r.vals[j]||0);ps.push(x/t*100);si+=x;st+=t});\nreturn{name,v:ps.length?(S.mode=='mean'?ps.reduce((a,b)=>a+b)/ps.length:si/st*100):null}});\nreturn{n:valid.length,T:Math.round(T),res}}\nconst fmt=v=>v==null?'—':(+v.toFixed(1))+'%';\nconst col=v=>v>=10?'var(--high)':v>=4?'var(--mid)':'var(--low)';\nfunction bars(c){return c.res.map(o=>`<div class=\"row\"><div class=\"t\"><span>${esc(o.name)}<\/span><b>${fmt(o.v)}<\/b><\/div><div class=\"bar\"><i style=\"width:${Math.min((o.v||0)*4,100)}%;background:${col(o.v||0)}\"><\/i><\/div><\/div>`).join('')}\nfunction infoLines(){const i=S.info,L=[];\nif(i.pivot)L.push('بيفوت '+i.pivot);if(i.farm)L.push('مزرعة '+i.farm);if(i.area)L.push('المساحة '+i.area+' فدان');\nif(i.variety)L.push('الصنف '+i.variety);if(i.age)L.push('العمر '+i.age+' يوم');if(i.canopy)L.push('كفاءة العرش '+i.canopy+'%');\nif(i.diam)L.push('قطر أكبر درنة '+i.diam+' سم');return L}\n\nfunction renderRep(){document.querySelector(`input[name=m][value=${S.mode}]`).checked=true;\nconst v=calc('veg'),t=calc('tub'),I=S.info;\n$('repBody').innerHTML=`<div class=\"card\"><h2>تقرير فحص ${I.pivot?'بيفوت '+esc(I.pivot):'البيفوت'} ${I.farm?'- مزرعة '+esc(I.farm):''}<\/h2>\n${I.date?`<div class=\"note\">${esc(I.date)}<\/div>`:''}\n<div>${infoLines().filter((x,i)=>i>1||!I.pivot&&!I.farm).map(x=>`<span class=\"kv\">${esc(x)}<\/span>`).join('')}<\/div><\/div>\n<div class=\"card\"><h2>الفحص الخضري<\/h2>${bars(v)}<div class=\"note\">عدد العينات: ${v.n} | إجمالي النباتات المفحوصة: ${v.T}<\/div><\/div>\n<div class=\"card\"><h2>فحص الدرنات<\/h2>${bars(t)}<div class=\"note\">عدد العينات: ${t.n} | إجمالي الدرنات المفحوصة: ${t.T}<\/div><\/div>\n${S.notes?`<div class=\"card\"><h2>ملاحظات<\/h2>${esc(S.notes).replace(/\\n/g,'<br>')}<\/div>`:''}`;\n$('wa').value=mkText()}\n\nfunction mkText(){const v=calc('veg'),t=calc('tub'),I=S.info,L=[];\nL.push('*تقرير فحص '+(I.pivot?'بيفوت '+I.pivot:'')+(I.farm?' - مزرعة '+I.farm:'')+'*');\nif(I.date)L.push(I.date);L.push(...infoLines());L.push('');\nL.push('*الفحص الخضري* (عينات: '+v.n+')');v.res.filter(o=>o.v!=null).forEach(o=>L.push('* '+o.name+' '+fmt(o.v)));L.push('');\nL.push('*فحص الدرنات* (عينات: '+t.n+' | درنات: '+t.T+')');t.res.filter(o=>o.v!=null).forEach(o=>L.push('* '+o.name+' '+fmt(o.v)));\nif(S.notes)L.push('','*ملاحظات:* '+S.notes);return L.join('\\n')}\n\nfunction waOpen(){window.open('https://wa.me/?text='+encodeURIComponent($('wa').value),'_blank')}\nasync function copyT(){const t=$('wa').value;try{await navigator.clipboard.writeText(t)}catch(e){$('wa').select();document.execCommand('copy')}alert('تم النسخ')}\nfunction shareT(){const t=$('wa').value;if(navigator.share)navigator.share({text:t}).catch(()=>{});else copyT()}\n\nfunction dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}\nconst fn=()=>'تقرير_'+(S.info.pivot||'بيفوت')+'_'+(S.info.date||'');\nfunction sheet(sec){const d=S[sec],v=sec=='veg';\nreturn [[...(v?['المسافة']:[]),'الإجمالي',...d.cols],...d.rows.map(r=>[...(v?[r.dist]:[]),r.total,...d.cols.map((c,j)=>r.vals[j]??'')])]}\nfunction exX(){if(typeof XLSX=='undefined')return alert('مكتبة Excel غير محملة (يلزم اتصال بالإنترنت)');\nconst wb=XLSX.utils.book_new(),v=calc('veg'),t=calc('tub');\nconst sum=[['البيانات',''],...F.map(([k,l])=>[l,S.info[k]]),[],['الفحص الخضري','%'],...v.res.map(o=>[o.name,o.v==null?'':+o.v.toFixed(2)]),[],['فحص الدرنات','%'],...t.res.map(o=>[o.name,o.v==null?'':+o.v.toFixed(2)]),[],['ملاحظات',S.notes]];\nXLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'ملخص');\nXLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sheet('veg')),'خضري');\nXLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sheet('tub')),'درنات');\nXLSX.writeFile(wb,fn()+'.xlsx')}\nfunction exC(){const q=a=>a.map(r=>r.map(x=>'\"'+String(x??'').replace(/\"/g,'\"\"')+'\"').join(',')).join('\\n');\ndl(fn()+'_خضري.csv','\\ufeff'+q(sheet('veg')),'text/csv');setTimeout(()=>dl(fn()+'_درنات.csv','\\ufeff'+q(sheet('tub')),'text/csv'),300)}\nfunction exJ(){dl(fn()+'.json',JSON.stringify(S,null,1),'application/json')}\nfunction exT(){dl(fn()+'.txt',mkText(),'text/plain')}\n\nfunction addRow(sec,o){const d=S[sec];const r=blank();r.dist=o.dist??'';r.total=o.total??'';\nObject.entries(o.map).forEach(([n,x])=>{let j=d.cols.findIndex(c=>c.trim()==n.trim());if(j<0){d.cols.push(n);j=d.cols.length-1}r.vals[j]=x});\nif(d.rows.length==1&&!d.rows[0].vals.some(x=>x!==''&&x!=null)&&d.rows[0].total===''&&d.rows[0].dist==='')d.rows=[];d.rows.push(r)}\nconst ad=s=>s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));\nfunction impText(txt){txt=ad(txt||'');if(!txt.trim())return;let sec='veg',m={veg:{},tub:{}},got=0,I=S.info;\ntxt.split(/\\r?\\n/).forEach(raw=>{const l=raw.replace(/^[\\s*•\\-–]+/,'').replace(/\\*/g,'').trim();\nif(!l){if(Object.keys(m.veg).length)sec='tub';return}let x;\nif(x=l.match(/^بيفوت\\s*(\\S+)/)){I.pivot=x[1];return}if(x=l.match(/^مزرعة\\s*(.+)/)){I.farm=x[1].trim();return}\nif(x=l.match(/المساحة\\D*([\\d.]+)/)){I.area=x[1];return}if(x=l.match(/^الصنف\\s*[:\\-]?\\s*(.+)/)){I.variety=x[1].trim();return}\nif(x=l.match(/^العمر\\D*([\\d.]+)/)){I.age=x[1];return}if(x=l.match(/كفاءة العرش\\D*([\\d.]+)/)){I.canopy=x[1];return}\nif(x=l.match(/^قطر.*?([\\d.]+)/)){I.diam=x[1];return}\nif(x=l.match(/^(.+?)\\s*[:=]?\\s*(\\d+(?:[.,]\\d+)?)\\s*%/)){const n=x[1].replace(/[:\\-]+$/,'').trim(),p=x[2].replace(',','.');\nif(/درنات|جرب|اخضرار/.test(n)&&!/^من\\b/.test(n))sec='tub';m[sec][n]=p;got++}});\n['veg','tub'].forEach(s=>{if(Object.keys(m[s]).length)addRow(s,{total:100,map:m[s]})});\nsave();renderData();alert(got?'تم الاستيراد ('+got+' بند). النسب أُدخلت كعينة من 100.':'لم يتم العثور على بيانات')}\nfunction impFiles(fl){[...fl].forEach(f=>{const rd=new FileReader(),ext=f.name.split('.').pop().toLowerCase();\nif(ext=='txt'){rd.onload=()=>impText(rd.result);rd.readAsText(f)}\nelse if(ext=='json'){rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.veg&&o.tub){S=Object.assign(fresh(),o);save();renderData()}else alert('ملف JSON غير مطابق')}catch(e){alert('ملف JSON غير صالح')}};rd.readAsText(f)}\nelse{if(typeof XLSX=='undefined')return alert('مكتبة Excel غير محملة (يلزم اتصال بالإنترنت)');\nrd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});wb.SheetNames.forEach(sn=>{if(sn=='ملخص')return;\nconst sec=/درن|tub/i.test(sn+(wb.SheetNames.length==1?f.name:''))?'tub':'veg';\nconst A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(A.length<2)return;\nconst H=A[0].map(String);const ti=H.findIndex(h=>/إجمال|total|عدد/i.test(h)),di=H.findIndex(h=>/مساف|dist/i.test(h));\nA.slice(1).forEach(r=>{const map={};H.forEach((h,j)=>{if(j==ti||j==di||!h.trim()||/^#$|^م$/.test(h))return;if(r[j]!==''&&!isNaN(r[j]))map[h]=r[j]});\nif(Object.keys(map).length)addRow(sec,{dist:di>=0?r[di]:'',total:ti>=0?r[ti]:'',map})})});\nsave();renderData()}catch(e){alert('تعذر قراءة الملف '+f.name)}};rd.readAsArrayBuffer(f)}});$('fi').value=''}\nrenderData();\n<\/script>\n<\/   }catch(e){}

function injectBridge(html){
  if(!html) return html;
  if(html.indexOf('</head>')>=0) return html.replace('</head>', BRIDGE+'</head>');
  if(html.indexOf('<body')>=0) return html.replace(/<body[^>]*>/, function(m){return m+BRIDGE});
  return BRIDGE+html;
}
function broadcastTheme(){

}
function broadcastLang(){
  const msg={type:'athmar-lang',lang:typeof shellLang!=='undefined'?shellLang:'ar'};
  [...views.querySelectorAll('iframe')].forEach(f=>{try{f.contentWindow&&f.contentWindow.postMessage(msg,'*')}catch(e){}});

function snap(){const d={};KEYS.forEach(k=>{const v=ls.g(k);if(v!==null)d[k]=v});return d}

/* نسخة ثانية في IndexedDB */
function idb(fn){return new Promise(res=>{try{const r=indexedDB.open('athmar_backup',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onerror=()=>res(null);r.onsuccess=()=>{try{fn(r.result,res)}catch(e){res(null)}}}catch(e){res(null)}})}
const idbPut=d=>idb((db,res)=>{const t=db.transaction('s','readwrite');t.objectStore('s').put({t:Date.now(),d},'snap');t.oncomplete=()=>res(1);t.onerror=()=>res(null)});
const idbGet=()=>idb((db,res)=>{const q=db.transaction('s').objectStore('s').get('snap');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)});
let lastMirror='';
function mirror(){const d=snap(),j=JSON.stringify(d);if(j===lastMirror||!hasData(d))return;lastMirror=j;idbPut(d)}
function status(){
  const t=+ls.g('athmar_lastbackup')||0,d=snap();let s,w=false;
  if(!hasData(d)){s='لا توجد بيانات مسجلة بعد'}
  else if(!t){s='⚠️ لم تحفظ نسخة احتياطية بعد';w=true}
  else{const days=Math.floor((Date.now()-t)/864e5);s=days<1?'✅ آخر نسخة احتياطية: اليوم':'آخر نسخة احتياطية: منذ '+days+' يوم';if(days>=7){s='⚠️ '+s+' – احفظ نسخة جديدة';w=true}}

async function persist(){let p='غير متاح';try{if(navigator.storage&&navigator.storage.persist){p=(await navigator.storage.persist())?'مفعّلة ✅ (المتصفح لن يمسح بياناتك تلقائيًا)':'لم يمنحها المتصفح بعد – اعتمد على النسخة الاحتياطية'}}catch(e){}return p}
async function openDlg(){$b('msg').textContent='';$b('dlg').classList.add('on');$b('info').textContent='جارٍ الفحص…';const p=await persist();$b('info').innerHTML='البيانات تُحفظ تلقائيًا على هذا الجهاز بعد كل تسجيل، ونُسخة ثانية احتياطية داخل المتصفح.<br>الحماية من المسح التلقائي: '+p+'<br>'+status()+'<br>احفظ ملف نسخة احتياطية بعد كل تجربة مهمة، وخزّنه في مكان آمن (واتساب لنفسك أو Google Drive).'}
async function doExport(){
  const d=snap();if(!hasData(d)){$b('msg').textContent='لا توجد بيانات لحفظها';return}
  const txt=JSON.stringify({app:'athmar',v:1,t:new Date().toISOString(),data:d},null,1);
  const name='athmar_backup_'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([txt],name,{type:'application/json'});let done=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done=true}}catch(e){if(e&&e.name==='AbortError')return}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  ls.s('athmar_lastbackup',Date.now());status();$b('msg').textContent='تم حفظ النسخة الاحتياطية ✅'}
function reloadViews(){const cur=(views.querySelector('iframe.on')||{}).dataset;[...views.children].forEach(f=>f.remove());show(cur&&cur.k||'pivot')}

$b('bf').onchange=async e=>{

async function repairInstall(){
  const msg=$b('msg');
  msg.textContent='جارٍ الإصلاح…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();

    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
